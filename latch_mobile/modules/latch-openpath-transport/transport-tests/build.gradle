plugins { id 'java' }
repositories { mavenCentral() }
dependencies {
  implementation 'com.squareup.okhttp3:okhttp:4.9.2'
  // Expo 58 raises Okio above React Native's version. Exercise that combination.
  implementation 'com.squareup.okio:okio:3.16.0'
  testImplementation 'com.squareup.okhttp3:mockwebserver:4.9.2'
  testImplementation 'com.squareup.okhttp3:okhttp-tls:4.9.2'
  testImplementation 'junit:junit:4.13.2'
}
sourceSets.main.java.srcDirs = ['../android/src/main/java']
test { testLogging { events 'passed', 'failed' } }
